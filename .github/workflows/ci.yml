name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts-soroban
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts-soroban
      - run: rustup update stable && rustup target add wasm32v1-none
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Run gas and resource profile harness
        run: cargo test --test resource_profile -- --nocapture
      - name: Upload resource profile report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resource-profile-report
          path: contracts-soroban/**/resource_profile_report.md
          if-no-files-found: ignore
      - run: cargo build --release --target wasm32v1-none -p payhub-escrow

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
